<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coachatron — Postcard</title>
  <style>
    :root {
      --page: #f6e7d8;
      --ink: #2c211c;
      --muted: #6d5348;
      --teal: #0e6b64;
      --teal-ink: #f6fffd;
      --clay: #c46a45;
      --clay-line: #a85634;
      --screen: #fffaf4;
      --screen-ink: #2c211c;
      --screen-muted: #7a655b;
      --card: #fff;
      --line: #eddccb;
      --good: #0e6b64;
      --alert: #b64024;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--page);
      color: var(--ink);
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      line-height: 1.35;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 28px 72px; }
    .kicker {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--teal);
    }
    h1 {
      font-weight: 500;
      font-size: clamp(3rem, 7vw, 5.4rem);
      line-height: 0.92;
      letter-spacing: -0.03em;
      margin: 14px 0 12px;
      max-width: 12ch;
    }
    .lede { max-width: 36rem; font-size: 1.25rem; margin: 0 0 36px; }
    .studio {
      display: grid;
      grid-template-columns: 200px 360px 1fr;
      gap: 32px;
      align-items: start;
    }
    nav.rail { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 2px; }
    .group {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 14px 0 4px;
    }
    .rail button {
      appearance: none;
      text-align: left;
      background: transparent;
      color: var(--ink);
      border: 0;
      border-left: 2px solid transparent;
      font: inherit;
      font-size: 1.05rem;
      padding: 6px 10px;
      cursor: pointer;
    }
    .rail button[aria-current="true"] { border-left-color: var(--teal); color: var(--teal); }
    .rail button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    .stage { display: flex; justify-content: center; }
    .phone {
      width: 320px;
      height: 660px;
      background: var(--clay);
      border: 1px solid var(--clay-line);
      border-radius: 40px;
      padding: 10px;
    }
    .screen {
      height: 100%;
      background: var(--screen);
      color: var(--screen-ink);
      border-radius: 32px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    .status {
      display: flex;
      justify-content: space-between;
      padding: 14px 18px 0;
      font-size: 12px;
      font-weight: 650;
    }
    .body {
      padding: 6px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }
    .eyebrow {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--screen-muted);
      margin: 6px 0 0;
    }
    .screen h2 {
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-weight: 500;
      font-size: 30px;
      line-height: 1;
      letter-spacing: -0.03em;
      margin: 0;
    }
    .sub { margin: 0; color: var(--screen-muted); font-size: 13px; }
    .foot { margin-top: auto; }
    .card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      background: var(--card);
    }
    .card strong { display: block; font-size: 15px; }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      color: var(--screen-muted);
      font-size: 13px;
    }
    .spots { color: var(--good); font-weight: 700; }
    .full { color: var(--alert); font-weight: 700; }
    .btn {
      margin-top: auto;
      border: 0;
      background: var(--teal);
      color: var(--teal-ink);
      border-radius: 999px;
      padding: 14px 12px;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
    }
    .btn.ghost {
      margin-top: 0;
      background: transparent;
      color: var(--screen-ink);
      border: 1px solid var(--line);
    }
    .stack { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
    .field label { display: block; font-size: 12px; color: var(--screen-muted); margin-bottom: 4px; }
    .field .box {
      border: 1px solid var(--line);
      background: white;
      border-radius: 14px;
      padding: 11px 12px;
      font-size: 15px;
    }
    .choice {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--line);
      background: white;
      border-radius: 18px;
      padding: 12px;
    }
    .choice.on { border-color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); }
    .choice b { font-weight: 700; }
    .choice span { color: var(--screen-muted); font-size: 13px; display: block; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .row:last-child { border-bottom: 0; }
    .pill {
      font-size: 12px;
      border-radius: 999px;
      padding: 4px 8px;
      background: #f3e6d4;
    }
    .money-figure {
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-size: 42px;
      letter-spacing: -0.03em;
      line-height: 1;
      margin: 0;
    }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px;
    }
    .stat b { display: block; font-size: 18px; margin-top: 2px; }
    .stat span { color: var(--screen-muted); font-size: 12px; }
    .bubble {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px 18px 18px 6px;
      padding: 10px 12px;
      font-size: 14px;
      max-width: 92%;
    }
    .bubble.me {
      margin-left: auto;
      background: var(--teal);
      color: var(--teal-ink);
      border-color: var(--teal);
      border-radius: 18px 18px 6px 18px;
    }
    .note { position: sticky; top: 20px; }
    .note h3 {
      font-weight: 500;
      font-size: 2rem;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin: 8px 0 12px;
    }
    .note p { margin: 0 0 12px; font-size: 1.15rem; }
    .note .fine {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 13px;
      color: var(--muted);
    }
    footer.colophon {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid #e4d0bc;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    @media (max-width: 980px) {
      .studio { grid-template-columns: 1fr; }
      nav.rail { position: static; flex-direction: row; flex-wrap: wrap; }
      .group { width: 100%; }
      .note { position: static; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">Coachatron · Postcard</div>
    <h1>A coach sells their time.</h1>
    <p class="lede">Sand, clay, and one teal action. Warm enough to forward. The twelve screens live in this room.</p>
    <section class="studio">
      <nav class="rail" id="rail" aria-label="Screens"></nav>
      <div class="stage">
        <div class="phone"><div class="screen" id="screen"></div></div>
      </div>
      <aside class="note" id="note"></aside>
    </section>
    <footer class="colophon">Sample week · not a real coach</footer>
  </div>
  <script>
    const screens = [
      { id: "public", group: "Parent", label: "Open sessions", title: "The link is the product.", why: "A parent opens one URL and sees time, spots, and price. No account.", fine: "This is the page that has to feel easy to forward.",
        html: `<div class="status"><span>9:14</span><span>LTE</span></div><div class="body"><p class="eyebrow">coachatron.com/c/northfield</p><h2>Evening sessions</h2><p class="sub">Tap a time. Pay before you arrive.</p><div class="card"><strong>Tue 7 Oct · 6:00pm</strong><div class="meta"><span>60 min · Field 3</span><span class="spots">2 spots · $35</span></div></div><div class="card"><strong>Thu 9 Oct · 6:00pm</strong><div class="meta"><span>60 min · Field 3</span><span class="full">Full · 3 waiting</span></div></div><div class="card"><strong>Sat 11 Oct · 9:00am</strong><div class="meta"><span>60 min · Field 1</span><span class="spots">5 spots · $35</span></div></div><div class="btn">Book Tue 6:00pm</div></div>` },
      { id: "book", group: "Parent", label: "Who's training", title: "A name and a phone.", why: "No account. The parent types the athlete, an email, and a phone. Credits on that phone apply by themselves.", fine: "One group of fields. Then pay.",
        html: `<div class="status"><span>9:14</span><span>LTE</span></div><div class="body"><p class="eyebrow">Tue 7 Oct · 6:00pm · $35</p><h2>Who's training</h2><div class="field"><label>Athlete</label><div class="box">Sam Reyes</div></div><div class="field"><label>Parent email</label><div class="box">parent@email.com</div></div><div class="field"><label>Phone</label><div class="box">(512) 555-0148</div></div><p class="sub">We'll text a link to manage this booking.</p><div class="btn">Continue to pay</div></div>` },
      { id: "pay", group: "Parent", label: "How to pay", title: "Three ways to buy the hour.", why: "Drop-in, a pack of ten, or a month. Square hosts the card. We never see it.", fine: "The prices are the coach's. The teal button is ours.",
        html: `<div class="status"><span>9:14</span><span>LTE</span></div><div class="body"><p class="eyebrow">Sam Reyes · Tue 6:00pm</p><h2>How to pay</h2><div class="choice on"><div><b>This session</b><span>One charge, tonight</span></div><b>$35</b></div><div class="choice"><div><b>10 sessions</b><span>Credits on this phone</span></div><b>$300</b></div><div class="choice"><div><b>Monthly</b><span>4 sessions, then they expire</span></div><b>$120</b></div><div class="btn">Pay $35 with Square</div></div>` },
      { id: "manage", group: "Parent", label: "Manage booking", title: "The text is the account.", why: "Cancel or move the booking from the link we already sent. The policy is on the screen.", fine: "The window is still an open question. The screen shows one, plainly.",
        html: `<div class="status"><span>9:14</span><span>LTE</span></div><div class="body"><p class="eyebrow">Booking</p><h2>You're in.</h2><div class="card"><strong>Tue 7 Oct · 6:00pm</strong><div class="meta"><span>60-min group · Field 3</span><span>Sam Reyes</span></div></div><p class="sub">Cancel before Mon 6:00pm and the credit comes back.</p><div class="stack"><div class="btn ghost">Reschedule</div><div class="btn">Cancel booking</div></div></div>` },
      { id: "signin", group: "Coach", label: "Sign in", title: "A phone number. No password.", why: "Setup finishes on the same phone that will run the business. One code, then the first session type.", fine: "Five minutes from here to a link someone can pay on.",
        html: `<div class="status"><span>9:14</span><span>LTE</span></div><div class="body"><p class="eyebrow">Coachatron</p><h2>Your phone</h2><p class="sub">We'll text a code. That's the sign-in.</p><div class="field"><label>Mobile number</label><div class="box">(512) 555-0199</div></div><div class="btn">Text me a code</div></div>` },
      { id: "schedule", group: "Coach", label: "This week", title: "One list. Tap a session.", why: "The coach's home is this week. Full, with people waiting, is the moment the product earns the fee.", fine: "Thursday asks. The coach decides.",
        html: `<div class="status"><span>9:14</span><span>LTE</span></div><div class="body"><p class="eyebrow">Schedule</p><h2>This week</h2><div class="card"><strong>Tue · 6:00pm</strong><div class="meta"><span>60-min group</span><span class="spots">6 of 8 · $210</span></div></div><div class="card"><strong>Thu · 6:00pm</strong><div class="meta"><span>60-min group</span><span class="full">Full · 3 waiting</span></div></div><div class="card"><strong>Sat · 9:00am</strong><div class="meta"><span>60-min group</span><span class="spots">3 of 8 · $105</span></div></div></div>` },
      { id: "detail", group: "Coach", label: "Who's in it", title: "The roster of one hour.", why: "Attendance, and cancel if the field is flooded. One session, one screen.", fine: "Cancelling texts everyone and returns credits, after the coach confirms.",
        html: `<div class="status"><span>9:14</span><span>LTE</span></div><div class="body"><p class="eyebrow">Tue 7 Oct · 6:00pm · Field 3</p><h2>60-min group</h2><div><div class="row"><span>Sam Reyes</span><span class="pill">Here</span></div><div class="row"><span>Noah Patel</span><span class="pill">Here</span></div><div class="row"><span>Mia Ortiz</span><span class="pill">—</span></div><div class="row"><span>Jonah Blake</span><span class="pill">Here</span></div><div class="row"><span>Priya Shah</span><span class="pill">—</span></div><div class="row"><span>Eli Nguyen</span><span class="pill">Here</span></div></div><div class="btn ghost">Cancel this session</div></div>` },
      { id: "types", group: "Coach", label: "Session types", title: "Name, length, spots, price.", why: "The first form is four facts. Everything else has a default.", fine: "Finishable with one thumb.",
        html: `<div class="status"><span>9:14</span><span>LTE</span></div><div class="body"><p class="eyebrow">What you sell</p><h2>Session types</h2><div class="card"><strong>60-min group</strong><div class="meta"><span>60 min · 8 athletes</span><span>$35</span></div></div><div class="card"><strong>Private</strong><div class="meta"><span>45 min · 1 athlete</span><span>$70</span></div></div><div class="btn">New session type</div></div>` },
      { id: "pricing", group: "Coach", label: "Packages", title: "A pack and a month.", why: "Drop-in already exists, because a session has a price. These are the only extra words.", fine: "Retire a price. Credits already sold stay valid.",
        html: `<div class="status"><span>9:14</span><span>LTE</span></div><div class="body"><p class="eyebrow">Pricing</p><h2>Packs and plans</h2><div class="card"><strong>10 sessions</strong><div class="meta"><span>Package</span><span>$300</span></div></div><div class="card"><strong>Monthly</strong><div class="meta"><span>4 sessions, unused expire</span><span>$120</span></div></div><div class="btn">Add a price</div></div>` },
      { id: "roster", group: "Coach", label: "Backup roster", title: "The second coach, in order.", why: "When a session is full, we text this list one person at a time. First yes wins.", fine: "They are not employees. We do not pay them.",
        html: `<div class="status"><span>9:14</span><span>LTE</span></div><div class="body"><p class="eyebrow">If you're full</p><h2>Backup roster</h2><div><div class="row"><span>1 · Cameron</span><span class="pill">First text</span></div><div class="row"><span>2 · Avery</span><span class="pill">Next</span></div><div class="row"><span>3 · Reese</span><span class="pill">Last</span></div></div><p class="sub">Add by phone. Twenty minutes to answer.</p><div class="btn">Add a coach</div></div>` },
      { id: "money", group: "Coach", label: "Money", title: "Their Square. Our 5%.", why: "There is no balance to withdraw. This screen is a window, not a wallet.", fine: "At about $1,000 a month they can switch to $49 and 0%.",
        html: `<div class="status"><span>9:14</span><span>LTE</span></div><div class="body"><p class="eyebrow">This week · in your Square</p><h2>Money</h2><p class="money-figure">$720</p><p class="sub">Collected. Booked was $840.</p><div class="pair"><div class="stat"><span>Credits out</span><b>14</b></div><div class="stat"><span>Next week</span><b>$640</b></div></div><p class="sub foot">We keep 5%. $49 a month and 0% once a month clears about $1,000.</p></div>` },
      { id: "offer", group: "Backup", label: "Claim a session", title: "One text. One yes.", why: "Time, field, headcount, and what it pays. Accept stops the cascade.", fine: "Reply Y does the same thing. This page is the fallback.",
        html: `<div class="status"><span>9:16</span><span>LTE</span></div><div class="body"><p class="eyebrow">Offer · expires in 18 min</p><h2>Thu 6:00pm</h2><div class="card"><strong>Field 3 · 8 athletes</strong><div class="meta"><span>60-min group</span><span>$80 to you</span></div></div><p class="sub">North Field is full and asked for a second group.</p><div class="stack"><div class="btn">Claim it</div><div class="btn ghost">Decline</div></div></div>` },
      { id: "text", group: "Text", label: "Ask, then do it", title: "The assistant asks first.", why: "Plain English in. One question back. Y runs it. The confirmation is written by the product.", fine: "Not a thirteenth screen. It lives in Messages.",
        html: `<div class="status"><span>9:21</span><span>LTE</span></div><div class="body"><p class="eyebrow">Messages · Coachatron</p><h2>Tuesday night</h2><div class="bubble me">cancel tomorrow's 6pm, field's flooded</div><div class="bubble">Cancel Tue 7 Oct, 6:00pm, 60-min group? 6 athletes booked. They'll be texted and credits returned. Reply Y.</div><div class="bubble me">Y</div><div class="bubble">Cancelled. 6 athletes notified, 6 credits returned.</div></div>` }
    ];

    const rail = document.getElementById("rail");
    const screen = document.getElementById("screen");
    const note = document.getElementById("note");
    let lastGroup = "";
    screens.forEach((s) => {
      if (s.group !== lastGroup) {
        const g = document.createElement("div");
        g.className = "group";
        g.textContent = s.group;
        rail.appendChild(g);
        lastGroup = s.group;
      }
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = s.label;
      b.dataset.id = s.id;
      b.addEventListener("click", () => show(s.id));
      rail.appendChild(b);
    });
    function show(id) {
      const s = screens.find((x) => x.id === id);
      screen.innerHTML = s.html;
      note.innerHTML = `<div class="kicker">${s.group}</div><h3>${s.title}</h3><p>${s.why}</p><p class="fine">${s.fine}</p>`;
      for (const b of rail.querySelectorAll("button")) {
        if (b.dataset.id === id) b.setAttribute("aria-current", "true");
        else b.removeAttribute("aria-current");
      }
    }
    show("public");
  </script>
</body>
</html>
