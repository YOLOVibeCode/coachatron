name: CI

on:
  pull_request:
  push:
    branches: [develop, staging, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The required check. .nvmrc is the one place the project's Node
      # version lives; Railway reads package.json engines (kept in step by
      # test/toolchain.test.ts) and nvm reads .nvmrc locally.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fresh clone, no secrets. Tests use PGlite and in-process fakes
      # (relay, model). Do not add Stripe, Square, Twilio, or LiteLLM credentials.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # npm test is scripts/run-tests.mjs. On Node 24 it runs a test file once
      # more only when V8 aborted that file's process (nodejs/node#66366, hit
      # through PGlite's WebAssembly) and no failure was reported before the
      # crash, counting the ones the file's process wrote to disk itself. The
      # rerun must pass, and it adds a warning to the run when it happened.
      # Anything else fails as before.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Two transactions at once on real Postgres (test/pg/): row locks and lock
  # waits, which PGlite cannot show because it runs one transaction at a
  # time. npm test skips these without TEST_DATABASE_URL. Not a required
  # check. The database is a throwaway service container with no password.
  postgres:
    name: Postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Race tests
        run: npm run test:pg

  # Early warning, never blocking: the newest LTS and the newest Current
  # release. When the next Node line becomes LTS, the lts/* job tests it
  # before anyone moves .nvmrc and engines.
  next-node:
    name: Next Node (${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: ['lts/*', 'latest']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
